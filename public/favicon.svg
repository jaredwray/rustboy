<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .plate { fill: #0c0a09 }
    .socket { fill: none; stroke: #8a7a6a; stroke-width: 1.6 }
    .optic { fill: #9bb84a }
    @media (prefers-color-scheme: light) {
      .plate { fill: #e6dcd0 }
      .socket { stroke: #2a221c }
      .optic { fill: #7a9428 }
    }
  </style>
  <rect class="plate" width="32" height="32" />
  <!-- One face: empty socket, warm green optic. -->
  <circle class="socket" cx="11.2" cy="16" r="3.4" />
  <circle class="optic" cx="20.8" cy="16" r="3.4" />
</svg>
